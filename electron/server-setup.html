<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Local page, no network: only its own inline script and styles. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<title>Server Address</title>
<style>
	:root { color-scheme: light dark; --bg: #f5f5f4; --fg: #1c1c1c; --muted: #6b6b6b; --field: #fff; --line: #d6d6d3; --accent: #1c1c1c; --accent-fg: #fff; --err: #b3261e; }
	@media (prefers-color-scheme: dark) { :root { --bg: #161616; --fg: #e8e8e6; --muted: #9a9a96; --field: #222; --line: #383836; --accent: #e8e8e6; --accent-fg: #161616; --err: #f2a49c; } }
	* { box-sizing: border-box; }
	body { margin: 0; padding: 22px 24px 20px; background: var(--bg); color: var(--fg); font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-user-select: none; }
	h1 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
	p { margin: 0 0 14px; color: var(--muted); }
	input { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--field); color: var(--fg); font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; -webkit-user-select: text; }
	input:focus { outline: 2px solid color-mix(in srgb, var(--fg) 35%, transparent); outline-offset: 1px; }
	#error { min-height: 18px; margin: 6px 0 10px; color: var(--err); }
	.row { display: flex; gap: 8px; align-items: center; }
	.spacer { flex: 1; }
	button { padding: 6px 14px; border-radius: 7px; border: 1px solid var(--line); background: transparent; color: var(--fg); font: inherit; }
	button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
	button:disabled { opacity: .5; }
</style>
</head>
<body>
	<h1>Server Address</h1>
	<p>Open your own LearnHarness server instead of running one on this Mac. LearnHarness restarts after a change.</p>
	<form id="form">
		<input id="url" type="text" placeholder="learn.example.com" autocomplete="url" spellcheck="false" autofocus>
		<div id="error" role="alert"></div>
		<div class="row">
			<button type="button" id="local">Use This Mac</button>
			<span class="spacer"></span>
			<button type="button" id="cancel">Cancel</button>
			<button type="submit" class="primary" id="connect">Connect</button>
		</div>
	</form>
<script>
	const $ = (id) => document.getElementById(id);
	const api = window.lhServerSetup;
	const busy = (on) => { for (const b of document.querySelectorAll("button")) b.disabled = on; };
	api.get().then(({ url, remote }) => {
		$("url").value = url ?? "";
		// Already local: "Use This Mac" would change nothing.
		$("local").disabled = !remote;
		$("url").select();
	});
	$("form").addEventListener("submit", async (event) => {
		event.preventDefault();
		$("error").textContent = "";
		busy(true);
		const result = await api.save($("url").value);
		if (result?.error) { $("error").textContent = result.error; busy(false); }
	});
	$("local").addEventListener("click", async () => { busy(true); await api.useLocal(); });
	$("cancel").addEventListener("click", () => api.cancel());
	document.addEventListener("keydown", (event) => { if (event.key === "Escape") api.cancel(); });
</script>
</body>
</html>
